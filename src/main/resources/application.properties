spring.application.name=Course_project

server.port=8080

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=VladBro2020_
spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# FreeMarker (separate loader path to keep Thymeleaf templates intact)
spring.freemarker.template-loader-path=classpath:/freemarker/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.cache=false
# Enable FreeMarker for templates placed under src/main/resources/freemarker/
spring.freemarker.enabled=true