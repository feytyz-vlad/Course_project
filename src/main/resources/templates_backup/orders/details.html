<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<body>
<main th:fragment="content">
    <div th:replace="~{fragments/hero :: hero(title=${'Деталі замовлення #' + order.orderId}, subtitle='Інформація про замовлення', bg='/vendor/logistcwr/assets/images/slider/slider-2.jpg')}"></div>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Замовлення #<span th:text="${order.orderId}">1</span></h2>
            <a th:href="@{/orders}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i>До списку
            </a>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Деталі замовлення</h5>
                        <span class="badge fs-6"
                              th:classappend="${order.status.name() == 'ACTIVE'} ? 'bg-success' :
                                             (${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                             (${order.status.name() == 'COMPLETED'} ? 'bg-secondary' :
                                             (${order.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-info')))"
                              th:text="${order.status.displayName}">Статус</span>
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tbody>
                            <tr>
                                <td class="text-muted fw-bold" style="width:40%">Автомобіль</td>
                                <td>
                                    <a th:href="@{/cars/{id}(id=${order.carId})}"
                                       th:text="${'Авто #' + order.carId}">Авто</a>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-muted fw-bold">Дата початку</td>
                                <td th:text="${order.startDate}">2025-01-01</td>
                            </tr>
                            <tr>
                                <td class="text-muted fw-bold">Дата кінця</td>
                                <td th:text="${order.endDate}">2025-01-07</td>
                            </tr>
                            <tr th:if="${order.actualReturnDate != null}">
                                <td class="text-muted fw-bold">Фактичне повернення</td>
                                <td th:text="${order.actualReturnDate}"></td>
                            </tr>
                            <tr>
                                <td class="text-muted fw-bold">Кількість днів</td>
                                <td th:text="${order.totalDays}">7</td>
                            </tr>
                            <tr>
                                <td class="text-muted fw-bold">Ціна за день</td>
                                <td><span th:text="${order.dailyRate}">1000</span> грн</td>
                            </tr>
                            <tr>
                                <td class="text-muted fw-bold">Загальна сума</td>
                                <td><strong class="text-primary fs-5"><span th:text="${order.totalCost}">7000</span> грн</strong></td>
                            </tr>
                            <tr th:if="${order.rejectionReason != null}">
                                <td class="text-muted fw-bold">Причина відмови</td>
                                <td class="text-danger" th:text="${order.rejectionReason}"></td>
                            </tr>
                            <tr th:if="${order.additionalNotes != null and !order.additionalNotes.isEmpty()}">
                                <td class="text-muted fw-bold">Примітки</td>
                                <td th:text="${order.additionalNotes}"></td>
                            </tr>
                            <tr>
                                <td class="text-muted fw-bold">Дата створення</td>
                                <td th:text="${order.createdAt}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Дії -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header"><h5 class="mb-0">Дії</h5></div>
                    <div class="card-body d-flex flex-column gap-2">

                        <!-- Скасування для клієнта -->
                        <form th:if="${order.status.name() == 'PENDING'}"
                              th:action="@{/orders/{id}/cancel(id=${order.orderId})}"
                              method="post" onsubmit="return confirm('Скасувати замовлення?')">
                            <button type="submit" class="btn btn-danger w-100">
                                <i class="fas fa-times me-2"></i>Скасувати
                            </button>
                        </form>

                        <!-- Адмін: підтвердити/відхилити -->
                        <div th:if="${session.userRole != null and session.userRole.name() == 'ADMIN' and order.status.name() == 'PENDING'}">
                            <form th:action="@{/orders/{id}/approve(id=${order.orderId})}" method="post" class="mb-2">
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="fas fa-check me-2"></i>Підтвердити
                                </button>
                            </form>
                            <form th:action="@{/orders/{id}/reject(id=${order.orderId})}" method="post">
                                <div class="input-group">
                                    <input type="text" class="form-control" name="reason" placeholder="Причина відмови...">
                                    <button type="submit" class="btn btn-warning">Відхилити</button>
                                </div>
                            </form>
                        </div>

                        <!-- Адмін: завершити -->
                        <form th:if="${session.userRole != null and session.userRole.name() == 'ADMIN' and order.status.name() == 'ACTIVE'}"
                              th:action="@{/orders/{id}/complete(id=${order.orderId})}" method="post">
                            <div class="mb-2">
                                <label class="form-label small">Дата повернення</label>
                                <input type="date" class="form-control form-control-sm" name="actualReturnDate" required>
                            </div>
                            <button type="submit" class="btn btn-secondary w-100">
                                <i class="fas fa-flag-checkered me-2"></i>Завершити оренду
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
