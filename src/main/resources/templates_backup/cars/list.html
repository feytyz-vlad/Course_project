<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<body>
<main th:fragment="content">
    <div th:replace="~{fragments/hero :: hero(title=${title != null ? title : 'Автомобілі'}, subtitle='Оберіть з нашого каталогу', bg='/vendor/logistcwr/assets/images/slider/slider-1.jpg', ctaText='Переглянути всі', ctaLink='/cars/available')}"></div>
    <section class="st-project-area pt-5 pb-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="st-section-title" th:text="${title != null ? title : 'Автомобілі'}">Автомобілі</h2>
                <div>
                    <a th:if="${session.userRole != null and session.userRole.name() == 'ADMIN'}" th:href="@{/cars/add}" class="st__btn">
                        <i class="fas fa-plus me-2"></i>Додати автомобіль
                    </a>
                </div>
            </div>

            <!-- Фільтры (сохраняем функционал, оформим в тему) -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/cars/search}" method="get" class="row g-3">
                        <div class="col-md-3">
                            <input type="text" class="form-control" name="brand" th:value="${searchBrand}" placeholder="Бренд">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="transmission">
                                <option value="">Усі</option>
                                <th:block th:if="${transmissionTypes != null}">
                                    <option th:each="type : ${transmissionTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option>
                                </th:block>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="fuel">
                                <option value="">Усі</option>
                                <th:block th:if="${fuelTypes != null}">
                                    <option th:each="type : ${fuelTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option>
                                </th:block>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Шукати</button>
                            <a th:href="@{/cars/available}" class="btn btn-outline-secondary">Скинути</a>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${cars == null or cars.isEmpty()}" class="alert alert-info">Автомобілів не знайдено</div>

            <div class="row">
                <div class="col-md-6 col-lg-4 mb-4" th:each="car : ${cars}">
                    <div class="st__project__box shadow-sm h-100">
                        <div class="st__project__thumb">
                            <a th:href="@{/cars/{id}(id=${car.carId})}">
                                <img th:src="${car.imageUrl != null ? car.imageUrl : '/vendor/logistcwr/assets/images/slider/slider-1.jpg'}" alt="" class="img-fluid" style="height:220px; width:100%; object-fit:cover;">
                            </a>
                        </div>
                        <div class="st__project__content p-3">
                            <h5 class="mb-1"><a th:href="@{/cars/{id}(id=${car.carId})}" th:text="${car.fullName}">Car</a></h5>
                            <p class="text-muted small mb-2">
                                <i class="fas fa-cog me-1"></i><span th:text="${car.transmissionType.displayName}"></span>
                                &nbsp;•&nbsp;
                                <i class="fas fa-gas-pump me-1"></i><span th:text="${car.fuelType.displayName}"></span>
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-primary fw-bold" th:text="${car.dailyRate} + ' грн'">0 грн</div>
                                    <small class="text-muted">за добу</small>
                                </div>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/cars/{id}(id=${car.carId})}" class="btn btn-outline-primary btn-sm">Деталі</a>
                                    <a th:if="${car.status != null and car.status.name() == 'AVAILABLE' and session.userId != null}" th:href="@{/orders/create(carId=${car.carId})}" class="btn btn-primary btn-sm">Орендувати</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
