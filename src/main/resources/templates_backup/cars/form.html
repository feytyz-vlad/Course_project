<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<body>
<main th:fragment="content">
    <div th:replace="~{fragments/hero :: hero(title=${car.carId != null ? 'Редагування автомобіля' : 'Додати автомобіль'}, subtitle='Заповніть форму', bg='/vendor/logistcwr/assets/images/slider/slider-3.jpg')}"></div>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-car me-2"></i>
                            <span th:text="${car.carId != null ? 'Редагування автомобіля' : 'Додати автомобіль'}">Форма</span>
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${car.carId != null ? '/cars/' + car.carId + '/edit' : '/cars/add'}"
                              method="post">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Бренд *</label>
                                    <input type="text" class="form-control" name="brand"
                                           th:value="${car.brand}" required placeholder="Toyota">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Модель *</label>
                                    <input type="text" class="form-control" name="model"
                                           th:value="${car.model}" required placeholder="Camry">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Рік *</label>
                                    <input type="number" class="form-control" name="year"
                                           th:value="${car.year}" required min="2000" max="2030">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Колір</label>
                                    <input type="text" class="form-control" name="color"
                                           th:value="${car.color}" placeholder="Чорний">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Кількість місць *</label>
                                    <input type="number" class="form-control" name="seatsCount"
                                           th:value="${car.seatsCount}" required min="1" max="9">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Реєстраційний номер *</label>
                                    <input type="text" class="form-control" name="registrationNumber"
                                           th:value="${car.registrationNumber}" required placeholder="AA1234BB">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">VIN-код</label>
                                    <input type="text" class="form-control" name="vinCode"
                                           th:value="${car.vinCode}" placeholder="VIN">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">КПП *</label>
                                    <select class="form-select" name="transmissionType" required>
                                        <option value="">Оберіть...</option>
                                        <option th:each="type : ${transmissionTypes}"
                                                th:value="${type.name()}"
                                                th:text="${type.displayName}"
                                                th:selected="${car.transmissionType != null and car.transmissionType == type}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Паливо *</label>
                                    <select class="form-select" name="fuelType" required>
                                        <option value="">Оберіть...</option>
                                        <option th:each="type : ${fuelTypes}"
                                                th:value="${type.name()}"
                                                th:text="${type.displayName}"
                                                th:selected="${car.fuelType != null and car.fuelType == type}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Статус</label>
                                    <select class="form-select" name="status">
                                        <option th:each="st : ${carStatuses}"
                                                th:value="${st.name()}"
                                                th:text="${st.displayName}"
                                                th:selected="${car.status != null and car.status == st}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ціна за день (грн) *</label>
                                    <input type="number" class="form-control" name="dailyRate"
                                           th:value="${car.dailyRate}" required min="0" step="0.01">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Пробіг (км)</label>
                                    <input type="number" class="form-control" name="mileage"
                                           th:value="${car.mileage}" min="0">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">URL зображення</label>
                                <input type="url" class="form-control" name="imageUrl"
                                       th:value="${car.imageUrl}" placeholder="https://...">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Опис</label>
                                <textarea class="form-control" name="description" rows="3"
                                          placeholder="Опис автомобіля..." th:text="${car.description}"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Зберегти
                                </button>
                                <a th:href="@{/cars}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Назад
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
