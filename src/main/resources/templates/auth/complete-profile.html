<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{Layout :: layout}">
<body>
<main th:fragment="content">
    <div th:replace="~{fragments/hero :: hero(title='Завершення реєстрації', subtitle='Додайте дані профілю для оренди автомобілів', bg='/vendor/logistcwr/assets/images/slider/slider-4.jpg')}"></div>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-id-card fa-4x text-primary mb-3"></i>
                            <h2>Завершення реєстрації</h2>
                            <p class="text-muted">Заповніть профіль клієнта для оренди автомобілів</p>
                        </div>

                        <form th:action="@{/register/complete}" method="post">
                            <div class="mb-3">
                                <label class="form-label">ФІО</label>
                                <input type="text" class="form-control" name="fio"
                                       required placeholder="Прізвище Ім'я По батькові" maxlength="255">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Телефон</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="tel" class="form-control phone-mask" name="phone"
                                           required pattern="^\+380-\d{2}-\d{3}-\d{2}-\d{2}$" placeholder="+380-**-***-**-**">
                                </div>
                                <div class="form-text">Формат: +380-XX-XXX-XX-XX</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">РНОКПП (ІПН)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                                    <input type="text" class="form-control rnokpp-mask" name="rnokpp"
                                           required pattern="^\d{10}$" maxlength="10" placeholder="1234567890">
                                </div>
                                <div class="form-text">Має містити 10 цифр</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Номер водійського посвідчення</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                    <input type="text" class="form-control" name="driverLicense"
                                           required placeholder="XXX000000">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-check me-2"></i>Зберегти профіль
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Phone mask
            const phoneInputs = document.querySelectorAll('.phone-mask');
            phoneInputs.forEach(input => {
                input.addEventListener('input', function(e) {
                    let val = this.value.replace(/\D/g, '');
                    
                    // Keep 380 prefix
                    if (val.length > 0 && !val.startsWith('380')) {
                        if (val.startsWith('0')) {
                            val = '38' + val;
                        } else if (val.startsWith('80')) {
                            val = '3' + val;
                        } else {
                            val = '380' + val;
                        }
                    }
                    if (val.length > 12) val = val.substring(0, 12);
                    
                    let formatted = '+';
                    if (val.length > 0) formatted += val.substring(0, 3);
                    if (val.length > 3) formatted += '-' + val.substring(3, 5);
                    if (val.length > 5) formatted += '-' + val.substring(5, 8);
                    if (val.length > 8) formatted += '-' + val.substring(8, 10);
                    if (val.length > 10) formatted += '-' + val.substring(10, 12);
                    
                    this.value = val.length === 0 ? '' : formatted;
                });
                // Initial format if value exists
                if (input.value) {
                    input.dispatchEvent(new Event('input'));
                }
            });

            // RNOKPP mask
            const rnokppInputs = document.querySelectorAll('.rnokpp-mask');
            rnokppInputs.forEach(input => {
                input.addEventListener('input', function(e) {
                    let val = this.value.replace(/\D/g, '');
                    if (val.length > 10) val = val.substring(0, 10);
                    this.value = val;
                });
            });
        });
    </script>
</main>
</body>
</html>
