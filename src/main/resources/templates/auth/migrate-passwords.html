<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Миграция паролей</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Миграция паролей</h3>
                    </div>
                    <div class="card-body">
                        <!-- Сообщения об ошибках -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <!-- Сообщения об успехе -->
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        
                        <form action="/migrate-passwords" method="post">
                            <div class="mb-3">
                                <label for="secretKey" class="form-label">Секретный ключ</label>
                                <input type="password" class="form-control" id="secretKey" name="secretKey" required>
                                <div class="form-text">Введите секретный ключ для запуска миграции</div>
                            </div>
                            <button type="submit" class="btn btn-warning" 
                                    onclick="return confirm('Вы уверены, что хотите мигрировать все пароли?')">Мигрировать пароли</button>
                        </form>
                        
                        <div class="mt-3">
                            <a href="/auth/login">Войти</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
