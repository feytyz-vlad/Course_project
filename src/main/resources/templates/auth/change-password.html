<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk" th:replace="~{Layout :: layout}">
<body>
<main th:fragment="content">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Зміна пароля</h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        
                        <form th:action="@{/profile/change-password}" method="post">
                            <div class="mb-3">
                                <label for="oldPassword" class="form-label">Поточний пароль</label>
                                <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Новий пароль</label>
                                <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6">
                                <div class="form-text">Пароль має містити щонайменше 6 символів.</div>
                            </div>
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Підтвердження нового пароля</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="6">
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/profile}" class="btn btn-outline-secondary me-md-2">Скасувати</a>
                                <button type="submit" class="btn btn-primary">Змінити пароль</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
