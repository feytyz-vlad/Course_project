<!DOCTYPE html>
<!-- Hero fragment for pages — accepts parameters: title, subtitle, bg, ctaText, ctaLink -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="hero(title, subtitle, bg, ctaText, ctaLink)">
    <section class="st-page-title-area py-5 text-white" th:style="${bg} != null ? 'background-image: url(' + ${bg} + '); background-size: cover; background-position: center;' : ''">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-7">
                    <div class="st-page-title-content">
                        <h1 class="display-5 fw-bold" th:text="${title}">Заголовок сторінки</h1>
                        <p class="lead text-muted" th:text="${subtitle}">Короткий опис сторінки</p>
                        <div th:if="${ctaText != null}" class="mt-3">
                            <a th:href="${ctaLink}" th:text="${ctaText}" class="btn btn-primary"></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
