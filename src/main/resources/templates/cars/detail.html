<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk" th:replace="~{Layout :: layout}">
<body>
<main th:fragment="content">
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <img th:src="${car.imageUrl != null ? car.imageUrl : '/vendor/logistcwr/assets/images/slider/slider-1.jpg'}"
                     class="img-fluid rounded" alt="Car image">
            </div>
            <div class="col-md-6">
                <h2 th:text="${car.fullName}">Brand Model Year</h2>
                <p><strong>Реєстраційний номер:</strong> <span th:text="${car.registrationNumber}">ABC123</span></p>
                <p><strong>Коробка передач:</strong> <span th:text="${car.transmissionType.displayName}">Автомат</span></p>
                <p><strong>Паливо:</strong> <span th:text="${car.fuelType.displayName}">Бензин</span></p>
                <p><strong>Ціна за добу:</strong> <span th:text="${car.dailyRate}">1000</span> грн</p>
                <p><strong>Статус:</strong> <span th:text="${car.status.displayName}">Доступний</span></p>
                <div class="mt-3">
                    <a th:href="@{/orders/create(carId=${car.carId})}" class="btn btn-primary">Орендувати</a>
                    <a th:href="@{/cars/available}" class="btn btn-outline-secondary">Повернутися до каталогу</a>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-12">
                <h5>Опис</h5>
                <p th:text="${car.description != null ? car.description : 'Опис відсутній.'}">Опис авто</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
