<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk" th:replace="~{layout :: layout}">
<body>
<main th:fragment="content">
    <div class="container mt-4">
        <h2>Доступні автомобілі</h2>
        
        <div th:if="${cars == null or cars.isEmpty()}" class="alert alert-info">
            Наразі немає доступних автомобілів.
        </div>

        <div class="row">
            <div class="col-md-4 mb-4" th:each="car : ${cars}">
                <div class="card h-100">
                    <img th:src="${car.imageUrl ?: '/vendor/logistcwr/assets/images/slider/slider-1.jpg'}" 
                         class="card-img-top" alt="Car image" style="height:200px; object-fit:cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${car.fullName}">Brand Model</h5>
                        <p class="text-muted">
                            <i class="fas fa-cog me-1"></i> 
                            <span th:text="${car.transmissionType.displayName}">Auto</span>
                            &nbsp;•&nbsp;
                            <i class="fas fa-gas-pump me-1"></i> 
                            <span th:text="${car.fuelType.displayName}">Fuel</span>
                        </p>
                        <div class="d-flex justify-content-between align-items-end mt-3">
                            <div>
                                <div class="fw-bold" th:text="${car.dailyRate + ' грн/доба'}">1000 грн/доба</div>
                            </div>
                            <a th:href="@{/cars/{id}(id=${car.carId})}" class="btn btn-primary btn-sm">Деталі</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
