<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayForPay - Імітація оплати</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .payment-card { max-width: 500px; margin: 50px auto; border-radius: 20px; border: none; overflow: hidden; }
        .payment-header { background: linear-gradient(135deg, #003366 0%, #004080 100%); color: white; padding: 30px; text-align: center; }
        .payment-body { padding: 40px; }
        .wayforpay-logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; }
        .amount-display { font-size: 32px; font-weight: 800; color: #003366; margin-bottom: 20px; }
        .card-preview { background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); border-radius: 15px; padding: 25px; color: white; margin-bottom: 30px; position: relative; height: 200px; }
        .chip { width: 50px; height: 35px; background: #d4af37; border-radius: 5px; margin-bottom: 20px; }
        .card-number { font-size: 20px; letter-spacing: 3px; font-family: 'Courier New', Courier, monospace; }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #dee2e6; }
        .form-control:focus { box-shadow: none; border-color: #003366; }
        .btn-pay { background-color: #003366; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 18px; transition: all 0.3s; }
        .btn-pay:hover { background-color: #002244; transform: translateY(-2px); }
        .btn-cancel { background: none; border: none; color: #6c757d; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card payment-card shadow-lg">
        <div class="payment-header">
            <div class="wayforpay-logo"><i class="fas fa-shield-halved me-2"></i>WayForPay</div>
            <p class="mb-0 opacity-75">Безпечна оплата замовлення #<span th:text="${order.orderId}">0</span></p>
        </div>
        <div class="payment-body">
            <div class="text-center mb-4">
                <div class="amount-display"><span th:text="${payment.amount}">0</span> <small class="fs-6 text-muted">UAH</small></div>
            </div>

            <!-- Fake Card Preview -->
            <div class="card-preview shadow">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="chip"></div>
                    <i class="fab fa-cc-visa fa-3x opacity-50"></i>
                </div>
                <div class="card-number mt-3">**** **** **** 4242</div>
                <div class="d-flex justify-content-between mt-4">
                    <div class="small opacity-75">CARD HOLDER</div>
                    <div class="small opacity-75">EXPIRES</div>
                </div>
                <div class="d-flex justify-content-between">
                    <div class="text-uppercase" th:text="${#authentication.name}">USER NAME</div>
                    <div>12 / 28</div>
                </div>
            </div>

            <form th:action="@{/payment/mock-process}" method="post">
                <input type="hidden" name="paymentId" th:value="${payment.paymentId}">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Номер картки</label>
                    <input type="text" class="form-control" placeholder="4444 4444 4444 4444" maxlength="19">
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Термін дії</label>
                        <input type="text" class="form-control" placeholder="MM/YY">
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">CVV</label>
                        <input type="password" class="form-control" placeholder="***" maxlength="3">
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" name="success" value="true" class="btn btn-primary btn-pay mb-2">Оплатити зараз</button>
                    <button type="submit" name="success" value="false" class="btn btn-outline-danger py-2 border-0 small opacity-75">Імітувати помилку</button>
                </div>
                
                <div class="text-center">
                    <a th:href="@{/orders/{id}(id=${order.orderId})}" class="btn btn-cancel">Скасувати та повернутися</a>
                </div>
            </form>
        </div>
        <div class="card-footer bg-white border-0 text-center pb-4">
            <img src="https://wayforpay.com/img/footer_img.png" alt="Trusted" style="height: 25px; opacity: 0.5;">
        </div>
    </div>
</div>

<script>
    // Simple card number formatting
    document.querySelector('input[placeholder="4444 4444 4444 4444"]').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formattedValue = "";
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) formattedValue += " ";
            formattedValue += value[i];
        }
        e.target.value = formattedValue;
    });
</script>

</body>
</html>
