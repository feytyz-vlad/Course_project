<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{Layout :: layout}">
<body>
<main th:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-4 text-center p-5">
                    <!-- Success Icon -->
                    <div class="mb-4">
                        <div style="width: 100px; height: 100px; background: linear-gradient(135deg, #28a745, #20c997); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 10px 30px rgba(40,167,69,0.3);">
                            <i class="fas fa-check" style="font-size: 3rem; color: white;"></i>
                        </div>
                    </div>

                    <h2 class="fw-bold mb-3" style="color: #003366;">Оплата успішна!</h2>
                    <p class="text-muted fs-5 mb-4" th:text="${successMessage}">Платіж успішно отримано!</p>

                    <div class="alert alert-info border-0 rounded-3" role="alert">
                        <i class="fas fa-info-circle me-2"></i>
                        Ваше замовлення передано адміністратору на розгляд. Ви отримаєте підтвердження найближчим часом.
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <a th:href="@{/orders/{id}(id=${orderId})}" class="btn btn-primary btn-lg rounded-3">
                            <i class="fas fa-file-contract me-2"></i>Переглянути замовлення
                        </a>
                        <a th:href="@{/orders}" class="btn btn-outline-secondary rounded-3">
                            <i class="fas fa-list me-2"></i>Мої замовлення
                        </a>
                        <a th:href="@{/cars/available}" class="btn btn-outline-dark rounded-3">
                            <i class="fas fa-car me-2"></i>Повернутися до каталогу
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
