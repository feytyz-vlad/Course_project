<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{Layout :: layout}">
<body>
<main th:fragment="content">
    <div th:replace="~{fragments/hero :: hero(title='Оформлення оренди', subtitle='Заповніть деталі замовлення', bg='/vendor/logistcwr/assets/images/slider/slider-4.jpg')}"></div>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-file-contract me-2"></i>Оформлення оренди</h5>
                    </div>
                    <div class="card-body p-4">

                        <!-- Інформація про авто -->
                        <div th:if="${car != null}" class="card bg-light mb-4">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-3">
                                        <img th:src="${car.imageUrl != null ? car.imageUrl : 'https://via.placeholder.com/150x100'}"
                                             class="img-fluid rounded" alt="Car">
                                    </div>
                                    <div class="col-md-9">
                                        <h5 th:text="${car.fullName != null ? car.fullName : car.brand + ' ' + car.model}">Car</h5>
                                        <p class="mb-1">
                                            <i class="fas fa-cog me-1 text-muted"></i>
                                            <span th:text="${car.transmissionType != null ? car.transmissionType.displayName : ''}"></span>
                                            &nbsp;|&nbsp;
                                            <i class="fas fa-gas-pump me-1 text-muted"></i>
                                            <span th:text="${car.fuelType != null ? car.fuelType.displayName : ''}"></span>
                                        </p>
                                        <h5 class="text-primary mb-0">
                                            <span th:text="${car.dailyRate}">0</span> грн/день
                                        </h5>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Форма замовлення -->
                        <form th:action="@{/orders/create}" method="post">
                            <input type="hidden" name="carId" th:value="${car != null ? car.carId : ''}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Дата початку *</label>
                                    <input type="date" class="form-control" name="startDate"
                                           required id="startDate" onchange="calculateCost()">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Дата кінця *</label>
                                    <input type="date" class="form-control" name="endDate"
                                           required id="endDate" onchange="calculateCost()">
                                </div>
                            </div>

                            <!-- Розрахунок вартості -->
                            <div id="costCalc" class="alert alert-info d-none mb-3">
                                <strong>Розрахунок:</strong>
                                <span id="daysCount">0</span> днів ×
                                <span th:text="${car != null ? car.dailyRate : 0}" id="dailyRate">0</span> грн =
                                <strong id="totalCost">0</strong> грн
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Примітки</label>
                                <textarea class="form-control" name="additionalNotes" rows="2"
                                          placeholder="Додаткові побажання..."></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-check me-2"></i>Підтвердити замовлення
                                </button>
                                <a th:href="${car != null ? '/cars/' + car.carId : '/cars/available'}"
                                   class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-arrow-left me-1"></i>Назад
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
    /*<![CDATA[*/
        // Безопасно встраиваем значение dailyRate; если Thymeleaf не обработает, останется 0
        const dailyRate = /*[[${car != null ? car.dailyRate : 0}]]*/ 0;

        function calculateCost() {
            const startEl = document.getElementById('startDate');
            const endEl = document.getElementById('endDate');
            if (!startEl || !endEl) return;
            const start = new Date(startEl.value);
            const end = new Date(endEl.value);
            if (start && end && end > start) {
                const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                const daysCountEl = document.getElementById('daysCount');
                const totalCostEl = document.getElementById('totalCost');
                if (daysCountEl) daysCountEl.textContent = days;
                if (totalCostEl) totalCostEl.textContent = (days * dailyRate).toFixed(2);
                const costCalc = document.getElementById('costCalc');
                if (costCalc) costCalc.classList.remove('d-none');
            }
        }

        // Установим минимальные даты при загрузке документа
        document.addEventListener('DOMContentLoaded', function () {
            const today = new Date().toISOString().split('T')[0];
            const startEl = document.getElementById('startDate');
            const endEl = document.getElementById('endDate');
            if (startEl) startEl.min = today;
            if (endEl) endEl.min = today;
        });
    /*]]>*/
    </script>
</main>
</body>
</html>
