<!DOCTYPE html>
<html th:replace="~{Layout :: layout}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fas fa-car-crash text-danger me-2"></i>Звіти про пошкодження</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Адмін</a></li>
                    <li class="breadcrumb-item active">Пошкодження</li>
                </ol>
            </nav>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="px-4 py-3">Дата</th>
                            <th class="py-3">Авто / Замовлення</th>
                            <th class="py-3">Опис пошкодження</th>
                            <th class="py-3">Вартість ремонту</th>
                            <th class="py-3">Штраф</th>
                            <th class="py-3">Статус</th>
                            <th class="px-4 py-3 text-end">Дії</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="report : ${reports}">
                            <td class="px-4">
                                <div class="small text-muted" th:text="${#temporals.format(report.createdAt, 'd MMMM yyyy, HH:mm', ukLocale)}">01.01.2024</div>
                            </td>
                            <td>
                                <div class="fw-bold">Замовлення #<span th:text="${report.orderId}">123</span></div>
                                <div class="small text-muted">ID авто: <span th:text="${report.carId}">45</span></div>
                            </td>
                            <td>
                                <div class="text-truncate" style="max-width: 250px;" th:text="${report.damageDescription}">Опис...</div>
                            </td>
                            <td>
                                <span class="fw-bold text-danger" th:text="${report.repairCost != null ? report.repairCost + ' грн' : 'Не оцінено'}">500 грн</span>
                            </td>
                            <td>
                                <span class="fw-bold text-warning" th:text="${report.fineAmount != null ? report.fineAmount + ' грн' : '0 грн'}">100 грн</span>
                            </td>
                            <td>
                                <span class="badge rounded-pill" 
                                      th:classappend="${report.repairStatus.name() == 'PAID' ? 'bg-success' : (report.repairStatus.name() == 'COMPLETED' ? 'bg-info' : 'bg-warning text-dark')}"
                                      th:text="${report.repairStatus.displayName}">Статус</span>
                            </td>
                            <td class="px-4 text-end">
                                <a th:href="@{'/orders/' + ${report.orderId}}" class="btn btn-sm btn-outline-primary rounded-pill">
                                    <i class="fas fa-eye me-1"></i> Замовлення
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reports)}">
                            <td colspan="7" class="text-center py-5">
                                <div class="text-muted">
                                    <i class="fas fa-check-circle fa-3x mb-3 text-success opacity-25"></i>
                                    <p>Жодних звітів про пошкодження не знайдено</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
