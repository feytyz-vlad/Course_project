<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" th:replace="~{Layout :: layout}">
<body>
<main th:fragment="content">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0"><i class="fas fa-car-crash me-2"></i>Фіксація пошкодження для <span th:text="${car.brand + ' ' + car.model}">Авто</span></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/manager/cars/{id}/damage(id=${car.carId})}" method="post">
                            <div class="mb-3">
                                <label for="orderId" class="form-label">ID Замовлення (якщо відомо, інакше 0)</label>
                                <input type="number" name="orderId" class="form-control" id="orderId" required value="0">
                            </div>
                            
                            <div class="mb-3">
                                <label for="damageDate" class="form-label">Дата пошкодження</label>
                                <input type="date" name="damageDate" class="form-control" id="damageDate" required th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Опис пошкоджень</label>
                                <textarea name="description" class="form-control" id="description" rows="5" required placeholder="Опишіть детально всі пошкодження автомобіля..."></textarea>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/cars/{id}(id=${car.carId})}" class="btn btn-outline-secondary">Скасувати</a>
                                <button type="submit" class="btn btn-danger">Зафіксувати пошкодження</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
